const REPO = 'amogo993/action-tracker';

function log(msg) {
  document.getElementById('log').textContent += '\n' + msg;
}

async function pushData() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  document.getElementById('log').textContent = 'Starting...';

  try {
    log('Fetching current SHA from GitHub...');
    const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/data.json`, {
      headers: {
        'Authorization': 'token ' + PAT,
        'Accept': 'application/vnd.github.v3+json'
      }
    });
    if (!getRes.ok) throw new Error('GET failed: ' + getRes.status + ' ' + await getRes.text());
    const fileData = await getRes.json();
    const sha = fileData.sha;
    log('Current SHA: ' + sha);

    log('Pushing updated data.json...');
    const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/data.json`, {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + PAT,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: 'Add action items from 05-18 Plaud meeting (items 008-260)',
        content: B64,
        sha: sha
      })
    });
    if (!putRes.ok) throw new Error('PUT failed: ' + putRes.status + ' ' + await putRes.text());
    const result = await putRes.json();
    log('✅ Success! Commit: ' + result.commit.sha);
    log('🎉 Tracker will update at https://amogo993.github.io/action-tracker/ in ~60 seconds.');
    btn.textContent = '✅ Done';
  } catch (err) {
    log('❌ Error: ' + err.message);
    btn.disabled = false;
  }
}
